
name: 'dbt_constraints'
version: '1.0.9-envato.1'
config-version: 2

# These macros depend on the results and graph objects in dbt >=0.19.0
# and has been tested with dbt >=1.0.0
# v1.0.3 adds usage of the attached_node attribute added in dbt 1.5.x
require-dbt-version: ">=1.5.0"

profile: 'dbt_constraints'

# All tests and macros in this packages are found in the macro path
macro-paths: ["macros"]
clean-targets:         # directories to be removed by `dbt clean`
  - "logs"
  - "target"
  - "dbt_packages"

# This package adds an automatic hook to create constraints
on-run-end:
  - "{{ dbt_constraints.create_constraints() }}"

# Global variables
vars:
  # The package can be temporarily disabled using this variable
  dbt_constraints_enabled: true

  # You can control which types of constraints are enabled globally
  dbt_constraints_pk_enabled: true
  dbt_constraints_uk_enabled: true
  dbt_constraints_fk_enabled: true
  dbt_constraints_nn_enabled: true

  # The package can also add constraints on sources if you have sufficient privileges
  dbt_constraints_sources_enabled: false

  # You can also be specific on which constraints are enabled for sources
  # You must also enable dbt_constraints_sources_enabled above
  dbt_constraints_sources_pk_enabled: true
  dbt_constraints_sources_uk_enabled: true
  dbt_constraints_sources_fk_enabled: true
  dbt_constraints_sources_nn_enabled: true

  # Enable this parameter if you want to skip using RELY for join elimination
  dbt_constraints_always_norely: false

  # Read constraint metadata a schema at a time instead of a table at a time.
  # SHOW <kind> KEYS IN SCHEMA costs 0.26s server-side and covers a whole
  # schema, against 0.08s per table, so this wins from a handful of tables up.
  dbt_constraints_bulk_cache: true

  # Read column metadata in bulk as well. DEFAULT OFF: INFORMATION_SCHEMA
  # compilation scales with the objects in the whole database (3.49s average,
  # more than its execution time) and it returns a row per column, which then
  # costs about 0.8ms each to walk in Jinja. Most projects should leave this off
  # and let contract-enforced models skip the column lookup entirely instead.
  dbt_constraints_bulk_columns: false

  # Apply constraint DDL as parallel ASYNC children of a Snowflake Scripting
  # block instead of one statement per round trip. Set false to restore
  # upstream's serial run_query per statement.
  dbt_constraints_parallel: true

  # Maximum ASYNC children per EXECUTE IMMEDIATE block. Measured throughput on
  # Snowflake is roughly 25 concurrent children.
  dbt_constraints_max_concurrency: 25

  # Warm one schema at a time at or below this many schemas, one database at a
  # time above it. SHOW ... IN SCHEMA costs 0.26s and SHOW ... IN DATABASE
  # 19.3s, so schema scope only loses somewhere past seventy schemas. The
  # default sits below that crossover so the common case is never the slow one.
  dbt_constraints_bulk_schema_threshold: 50
